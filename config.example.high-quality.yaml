# 高画质：原生分辨率 MP4/H.264、30fps、较高码率，文字与动效更清晰
# 使用：Copy-Item config.example.high-quality.yaml config.yaml
# 音频编码固定为 48 kHz 立体声、320 kbps，不在此配置。

mic_trigger:
  # 占麦后开始录屏的进程。name：进程名，不区分大小写。
  # 可选 path_prefix：可执行文件完整路径前缀，用于区分同名进程。
  watch:
    - name: Lark.exe
    - name: Feishu.exe
  # 这些进程占麦时不录屏。值为进程名。
  ignore:
    - SystemSettings.exe

record:
  # true：画面跟随鼠标所在显示器。false：固定在开录时的那块屏。
  # 跟随时，成片分辨率是面积最大的那块屏，较小的屏居中。
  follow_mouse: true
  # 帧率，整数 1–60。
  fps: 30
  # 视频码率（kbps），正整数。越大越清晰、文件越大。
  video_bitrate_kbps: 8000
  # 编码最大宽/高（像素）。0 表示不缩小。两者都大于 0 时才按比例缩小。
  encode_max_width: 0
  encode_max_height: 0
  # 容器：mp4 或 h264 = MP4/H.264；wmv 或其他值 = WMV。
  container: mp4

audio:
  # true/false。总开关，false 时不录音频。
  enabled: true
  system:
    # true/false。是否录系统默认扬声器。录制中更换 Windows 默认播放设备时会跟着切换。
    enabled: true
  microphone:
    # true/false。是否录系统默认麦克风。录制中更换 Windows 默认录音设备时会跟着切换。
    enabled: true
  gain:
    # 音量，单位 dB。0 为原音量，负数变小，正数变大。
    system_db: 0.0
    microphone_db: 0.0
  # true/false。true 时削掉过载采样，减轻爆音。
  clip_limit: true

output:
  # 保存目录。支持 %USERPROFILE%。
  dir: "%USERPROFILE%/Videos/AutoScreenRecorder"
  # 文件名模板。占位符：{datetime} 精确到分钟，{date}，{time}，{process}。
  # 同一分钟重名会自动加 _2、_3，不覆盖已有文件。扩展名建议与 container 一致。
  template: "{datetime}_{process}.mp4"

service:
  # 麦克风都释放后再等多秒才停止。整数，必须 >= 0。
  stop_delay_sec: 0
  # 占麦后再等多秒才开始录。整数，建议 >= 0。
  start_delay_sec: 0
