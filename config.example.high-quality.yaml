# 高画质：原生分辨率 MP4/H.265、30fps、较高码率，文字与动效更清晰
# 使用：Copy-Item config.example.high-quality.yaml config.yaml

mic_trigger:
  # 占麦后开始录屏的进程。name：进程名，不区分大小写。
  # 可选 path_prefix：可执行文件完整路径前缀，用于区分同名进程。
  watch:
    - name: Lark.exe
    - name: Feishu.exe
    - name: Zoom.exe
    - name: wemeetapp.exe
    - name: wwmapp.exe
    - name: Weixin.exe

record:
  # true：画面跟随鼠标所在显示器。false：固定在开录时的那块屏。
  # 跟随时，成片分辨率是面积最大的那块屏。较小的屏等比例缩放后居中，黑边只在上下或左右。
  follow_mouse: true
  # 帧率，整数 1–60。
  fps: 30
  # 视频平均码率（kbps）。动态码率：静止画面更低，变化大时最高到两倍。
  video_bitrate_kbps: 8000
  # 编码最大宽/高（像素）。0 表示不缩小。两者都大于 0 时才按比例缩小。
  encode_max_width: 0
  encode_max_height: 0
  # 容器：mp4 或 h264 = MP4；wmv 或其他值 = WMV。
  container: mp4
  # 视频编码。hevc：先 H.265，打不开再 H.264。h264：只用 H.264。容器为 wmv 时忽略。
  codec: hevc
  # vbr：动态码率，静止画面更低。cbr：固定在 video_bitrate_kbps。
  bitrate_mode: vbr
  # 动态码率最高值（kbps）。0 表示平均码率的两倍。不能低于平均码率。
  video_peak_bitrate_kbps: 0
  # 关键帧间隔，秒。0 表示 5。范围 0–30。
  keyframe_sec: 5

audio:
  # true/false。总开关，false 时不录音频。
  enabled: true
  # 平均码率（kbps）。0 表示 320。范围 0–512。
  bitrate_kbps: 320
  # 采样率。44100 或 48000。0 表示 48000。
  sample_rate: 48000
  # 声道。1 为单声道，2 为立体声。0 表示 2。
  channels: 2
  # vbr：MP4 的 AAC 尝试动态码率。cbr：固定码率。WMV 的 WMA 始终是固定码率。
  bitrate_mode: vbr
  system:
    # true/false。是否录系统默认扬声器。录制中更换 Windows 默认播放设备时会跟着切换。
    enabled: true
  microphone:
    # true/false。是否录系统默认麦克风。录制中更换 Windows 默认录音设备时会跟着切换。
    enabled: true
  gain:
    # 音量，单位 dB。0 为原音量，负数变小，正数变大。
    system_db: 0.0
    microphone_db: 0.0
  # true/false。true 时削掉过载采样，减轻爆音。
  clip_limit: true

output:
  # 保存目录。支持 %USERPROFILE%。
  dir: "%USERPROFILE%/Videos/AutoScreenRecorder"
  # 文件名模板。占位符：{datetime} 精确到分钟，{date}，{time}，{process}。
  # 同一分钟重名会自动加 _2、_3，不覆盖已有文件。扩展名建议与 container 一致。
  template: "{datetime}_{process}.mp4"

service:
  # 麦克风都释放后再等多秒才停止。整数，必须 >= 0。
  stop_delay_sec: 0
  # 占麦后再等多秒才开始录。整数，建议 >= 0。
  start_delay_sec: 0
